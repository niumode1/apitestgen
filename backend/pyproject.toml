[project]
name = "apitestgen"
version = "1.0.0"
description = "LLM-Driven API Automation Test Intelligent Generation Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.22.0",
    "alembic>=1.18.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.0",
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "openai>=2.32.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "python-jose>=3.5.0",
    "passlib[bcrypt]>=1.7.0",
    "cryptography>=49.0.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.20",
    "aiofiles>=25.0.0",
    "loguru>=0.7.0",
    "markdown-it-py>=4.0.0",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.0.0",
    "httpx>=0.28.0",
    "coverage>=7.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
